<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Voice Controller - Apprentissage
</title>


<link
href="css/bootstrap.min.css"
rel="stylesheet"
>

<link
rel="stylesheet"
href="css/bootstrap-icons.min.css"
>

<link
rel="stylesheet"
href="css/dashboard.css">


<link
rel="stylesheet"
href="css/telecommande.css">


</head>


<body>



<!-- SIDEBAR -->


<aside class="sidebar">



<div class="sidebar-logo">


<div class="sidebar-logo-icon">

<i class="bi bi-mic-fill"></i>

</div>



<div class="sidebar-logo-text">

<span>
VOICE
</span>


<strong>
CONTROLLER
</strong>


</div>


</div>





<nav class="sidebar-menu">



<a href="dashboard.html"
class="menu-item">

<i class="bi bi-house-door"></i>

<span data-i18n="dashboard">

Tableau de bord

</span>

</a>










<a href="apprentissage.html"
class="menu-item active">

<i class="bi bi-cpu"></i>

<span data-i18n="learning">

Apprentissage

</span>

</a>















<a href="parametres.html"
class="menu-item">

<i class="bi bi-gear"></i>

<span data-i18n="settings">

Paramètres

</span>

</a>









</nav>






<div class="sidebar-bottom">


<a
href="#"
onclick="logout()"
class="menu-item logout"
>


<i class="bi bi-box-arrow-right"></i>


<span data-i18n="logout">

Déconnexion

</span>


</a>


</div>



</aside>
<!-- =====================================
     CONTENU PRINCIPAL
===================================== -->


<main class="main-content">



<header class="remote-header">


<div class="welcome-card">


<div>


<h2 data-i18n="learningTitle">

Apprentissage des commandes

</h2>



<p data-i18n="learningText">

Enregistrez les codes infrarouges de votre télécommande télévision

</p>



</div>



<i class="bi bi-cpu-fill"></i>



</div>


</header>







<!-- TELECOMMANDE APPRENTISSAGE -->


<section class="remote-control">





<!-- COLONNE GAUCHE -->


<div class="remote-side remote-left">



<button
class="remote-button power-button learn-button non-appris"
data-command="power">

<i class="bi bi-power"></i>

</button>
<button
class="remote-button home-button learn-button non-appris"
data-command="home">


<i class="bi bi-house"></i>


</button>








</div>






<!-- CENTRE -->


<div class="remote-center">




//
<div class="vertical-control">



<button
class="remote-button small-control-button learn-button non-appris"
data-command="volume-up">


<i class="bi bi-plus-lg"></i>


</button>





<span class="control-label"
data-i18n="volume">

VOLUME

</span>






<button
class="remote-button small-control-button learn-button non-appris"
data-command="volume-down">


<i class="bi bi-dash-lg"></i>


</button>



</div>









<div class="navigation-control">



<button
class="navigation-button nav-up learn-button non-appris"
data-command="up">

<i class="bi bi-caret-up-fill"></i>

</button>




<button
class="navigation-button nav-down learn-button non-appris"
data-command="down">

<i class="bi bi-caret-down-fill"></i>

</button>




<button
class="navigation-button nav-left learn-button non-appris"
data-command="left">

<i class="bi bi-caret-left-fill"></i>

</button>




<button
class="navigation-button nav-right learn-button non-appris"
data-command="right">

<i class="bi bi-caret-right-fill"></i>

</button>






<button
class="ok-button learn-button non-appris"
data-command="ok">

OK

</button>



</div>




<div class="vertical-control">



<button
class="remote-button small-control-button learn-button non-appris"
data-command="channel-up">


<i class="bi bi-chevron-up"></i>


</button>




<span class="control-label"
data-i18n="channel">

CHANNEL

</span>




<button
class="remote-button small-control-button learn-button non-appris"
data-command="channel-down">


<i class="bi bi-chevron-down"></i>


</button>



</div>







</div>







<!-- COLONNE DROITE -->


<div class="remote-side remote-right">








<button
class="remote-button back-button learn-button non-appris"
data-command="back">

<i class="bi bi-arrow-left"></i>

</button>

<button
class="remote-button exit-button learn-button non-appris"
data-command="exit">


<i class="bi bi-box-arrow-right"></i>


</button>









</div>





</section>
<!-- =====================================
     FIN CONTENU
===================================== -->


<section class="remote-bottom">


</section>



</main>





<!-- =====================================
     JAVASCRIPT
===================================== -->


<script src="js/translations.js"></script>

<script src="js/language.js"></script>

<script src="js/theme.js"></script>

<script src="js/apprentissage.js"></script>

<script src="js/auth.js"></script>



</body>


</html>
