<main class="main-content remote-main">



<header class="remote-header">


<div class="welcome-card">


<div>


<h2 data-i18n="remoteTitle">

Télécommande virtuelle

</h2>



<p data-i18n="remoteText">

Contrôlez votre téléviseur facilement avec votre système Voice Controller.

</p>


</div>



<i class="bi bi-tv-fill"></i>



</div>


</header>






<section class="remote-control">





<!-- COLONNE GAUCHE -->

<div class="remote-side remote-left">



<button
class="remote-button power-button"
data-command="power">

<i class="bi bi-power"></i>

</button>




<button
class="remote-button back-button"
data-command="back">

<i class="bi bi-arrow-left"></i>

</button>



</div>








<!-- CENTRE -->

<div class="remote-center">





<!-- CHANNEL -->


<div class="vertical-control">



<button
class="remote-button small-control-button"
data-command="channel-up">

<i class="bi bi-chevron-up"></i>

</button>




<span 
class="control-label"
data-i18n="channel">

CHANNEL

</span>





<button
class="remote-button small-control-button"
data-command="channel-down">

<i class="bi bi-chevron-down"></i>

</button>



</div>







<!-- NAVIGATION -->


<div class="navigation-control">



<button
class="navigation-button nav-up"
data-command="up">

<i class="bi bi-caret-up-fill"></i>

</button>




<button
class="navigation-button nav-down"
data-command="down">

<i class="bi bi-caret-down-fill"></i>

</button>




<button
class="navigation-button nav-left"
data-command="left">

<i class="bi bi-caret-left-fill"></i>

</button>




<button
class="navigation-button nav-right"
data-command="right">

<i class="bi bi-caret-right-fill"></i>

</button>






<button
class="ok-button"
data-command="ok">

OK

</button>



</div>







<!-- VOLUME -->


<div class="vertical-control">



<button
class="remote-button small-control-button"
data-command="volume-up">

<i class="bi bi-plus-lg"></i>

</button>





<span
class="control-label"
data-i18n="volume">

VOLUME

</span>





<button
class="remote-button small-control-button"
data-command="volume-down">

<i class="bi bi-dash-lg"></i>

</button>



</div>






</div>







<!-- COLONNE DROITE -->


<div class="remote-side remote-right">



<button
class="remote-button exit-button"
data-command="exit">

<i class="bi bi-box-arrow-right"></i>

</button>





<button
class="remote-button home-button"
data-command="home">

<i class="bi bi-house"></i>

</button>




</div>





</section>
<!-- =========================================
     BOUTONS COULEURS
========================================= -->


<section class="remote-bottom">


</section>




</main>
